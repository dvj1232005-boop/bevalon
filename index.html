<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An Café Logo</title>
    <!-- Import Google Font tương đồng (Montserrat) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Đặt nền màu đỏ sẫm tương tự ảnh */
        body {
            background-color: #b52026; 
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
        }

        /* Container chứa toàn bộ logo */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 15px; /* Khoảng cách giữa icon và text */
        }

        /* Khung chứa icon chữ A */
        .logo-mark {
            width: 140px;
            height: auto;
        }

        /* Chữ AN CAFÉ */
        .logo-text {
            color: #FFFFFF;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 4px; /* Tạo khoảng cách chữ rộng giống ảnh */
            margin: 0;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Biểu tượng chữ A bằng SVG -->
        <svg class="logo-mark" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter">
                <!-- Đường chéo bên phải và cạnh đáy -->
                <path d="M 60 20 L 95 90 L 70 90 L 63 75 M 50 50 L 75 50" />
                
                <!-- Đường chéo bên trái và vòng lặp giọt nước -->
                <path d="M 60 20 L 35 70 C 30 80 40 95 50 85 C 60 75 50 60 45 65" />
            </g>
        </svg>

        <!-- Chữ Logo -->
        <h1 class="logo-text">AN CAFÉ</h1>
    </div>

</body>
</html>
